# 文件职责：声明 monorepo 工作区、依赖链接方式和允许执行安装脚本的包。
# 关键实现：apps/*、packages/*，hoisted node linker 与 Electron/esbuild allowBuilds。
packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted
blockExoticSubdeps: false

# pnpm 11 blocks dependency install scripts by default. Vite needs esbuild's
# platform-specific binary, and Electron needs its runtime download step.
allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: true
