<!doctype html>
<!--
  主要作用：提供桌面 Player Renderer 的安全 HTML 容器与 React 挂载点。
  关键函数与实现：CSP、#root、Renderer 模块入口；实现 CSP、根容器与模块入口声明。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: vn-game-asset:; media-src 'self' vn-game-asset:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>VN Engine Player</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
