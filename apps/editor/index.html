<!doctype html>
<!-- 主要作用：承载 Editor Renderer 的安全 HTML 入口。 -->
<!-- 关键实现：声明 CSP、挂载 React 根节点并加载 index.tsx。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: vn-asset:; media-src 'self' vn-asset:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'"
    />
    <title>Scratch Novel Engine</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
